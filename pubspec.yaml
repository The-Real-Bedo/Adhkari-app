name: adhkari
description: "أذكاري — أذكار وتسبيح ومكتبة القرآن الصوتية مع المصحف."
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.2
  share_plus: ^10.1.0
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  flutter_timezone: ^5.0.2 # 👈 لازم تضيف السطر ده هنا بالظبط

  # مكتبة القرآن الصوتية — الصوت من mp3quran.net
  http: ^1.2.2 # طلبات الـ API
  just_audio: ^0.9.42 # تشغيل الصوت والبث
  audio_service: ^0.18.15 # التحكم من الإشعار وشاشة القفل
  audio_session: ^0.1.21 # إعداد الجلسة الصوتية
  path_provider: ^2.1.5 # مسار حفظ التلاوات للاستماع بدون إنترنت

  # مواقيت الصلاة والقبلة — الحساب على الجهاز والموقع من الـ GPS
  adhan: ^2.0.0
  geolocator: ^13.0.2
  flutter_compass: ^0.8.0

  # ويدجت الشاشة الرئيسية
  home_widget: ^0.7.0



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  # ضفنا المكتبة هنا تحت الـ dev_dependencies
  flutter_launcher_icons: "^0.13.1"

# ده قسم مستقل بذاته بيتحط في آخر الملف خالص جهة الشمال
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/logo.png"
  # السطرين الجايين هما السر في نعومة الحواف
  adaptive_icon_background: "#050505" # لون الخلفية الأسود الملكي
  adaptive_icon_foreground: "assets/icon/logo.png" # صورتك هتتحط في النص بدون تمطيط

flutter:
  uses-material-design: true
  # لازم تعرف فلاتر إن عندك فولدر للصور عشان يشوف الأيقونة
  assets:
    - assets/icon/
    # نصوص رخصة OFL بتاعة الخطوط — بتتسجّل في LicenseRegistry وقت التشغيل
    # وبتظهر في صفحة التراخيص. الرخصة بتقول لازم تتوزّع مع الخط.
    - assets/licenses/

  fonts:
    # الخطوط مبنية جوه التطبيق عن قصد — قبل كده كانت بتتحمّل من الإنترنت
    # وقت التشغيل (google_fonts)، فأول فتح من غير نت كان بيطلع بخط النظام.
    # الأوزان المحطوطة هنا هي اللي الكود بيستعملها فعلًا وبس.

    # الخط الأساسي لكل واجهة التطبيق
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700

    # نص القرآن والأذكار
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700

    # اسم التطبيق في شاشة البداية
    - family: ScheherazadeNew
      fonts:
        - asset: assets/fonts/ScheherazadeNew-Bold.ttf
          weight: 700

    # سطر "A D H K A R I" اللاتيني في شاشة البداية
    - family: Raleway
      fonts:
        - asset: assets/fonts/Raleway-Light.ttf
          weight: 300
